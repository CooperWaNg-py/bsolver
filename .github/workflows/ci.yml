name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # libcurl for the pool client; OpenCL headers + ICD loader so the OpenCL backend is compiled
      # on Linux too (no GPU on the runner, so its tests skip).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev ocl-icd-opencl-dev opencl-headers

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBSOLVER_CUDA=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
